[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent-from-scratch"
version = "0.9.1"
description = "An AI agent runtime built from scratch: tool calling, loop, state, memory, planning, evals, reliability, security, tracing."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []                      # the core runtime is standard-library only

[tool.setuptools.packages.find]
include = ["agent*"]
